version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
    groups:
      # Minor and patch bumps arrive as one weekly PR; majors are opened individually.
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    ignore:
      # Major bumps of the toolchain are evaluated deliberately (PLAN.md D-01, stack verification):
      # @types/node must match the Node 24 runtime; TypeScript 6/7 needs eslint-config-next support.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

