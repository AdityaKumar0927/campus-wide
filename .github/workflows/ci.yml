name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_URL: http://localhost:3000
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: typecheck · lint · unit · build · e2e · lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile, supply-chain policies from pnpm-workspace.yaml)
        run: pnpm install --frozen-lockfile

      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start local Supabase (migrations + seed)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor

      # Keys come from the running stack (the CLI's local demo values), never from the repository.
      - name: Export local Supabase connection details
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "DATABASE_URL=$DB_URL"
            echo "DIRECT_DATABASE_URL=$DB_URL"
            echo "MAILPIT_URL=$MAILPIT_URL"
          } >> "$GITHUB_ENV"

      # Policy documents become policy_versions rows, so the consent and re-consent paths are real in CI.
      - name: Sync policy versions
        run: pnpm policies:sync

      - name: Database integration tests (auth hooks, triggers, RLS isolation)
        run: pnpm test:rls

      - name: Dependency audit (high and above)
        run: pnpm audit --audit-level high

      - name: Build
        run: pnpm build

      - name: Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Visual baselines are Linux-only. On the very first run none exist, so they are generated and
      # uploaded as an artifact to be committed under tests/e2e/__screenshots__; every later run compares.
      - name: E2E + accessibility + visual (390 px and 1440 px)
        run: |
          if find tests/e2e/__screenshots__ -name "*-linux.png" 2>/dev/null | grep -q .; then
            pnpm test:e2e
          else
            echo "::warning::No Linux visual baselines committed yet; generating them. Download the playwright artifact and commit tests/e2e/__screenshots__."
            pnpm test:e2e --update-snapshots
          fi
        env:
          CI: "true"

      - name: Upload Playwright report and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright
          path: |
            playwright-report
            test-results
            tests/e2e/__screenshots__
          retention-days: 14
          if-no-files-found: ignore

      # Report-only on localhost: Lighthouse's simulator attributes script downloads to the text LCP when
      # every request completes within milliseconds, which understates performance by 10-20 points while
      # accessibility, best-practices, and SEO are exact. The gate becomes blocking against the Vercel
      # preview URL once the project is linked (PLAN.md Phase 1 exit STOP).
      - name: Lighthouse budget (report-only until a preview URL exists)
        continue-on-error: true
        run: pnpm lighthouse:server
        env:
          CHROME_PATH: /usr/bin/google-chrome
          # Every public route plus the signed-out shape of the app routes (Phase 8 sweep).
          LH_ROUTES: root,offline,policies,policies/privacy,campus/illinois-tech,sign-in,feed

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: lighthouse-reports
          retention-days: 14
          if-no-files-found: ignore
