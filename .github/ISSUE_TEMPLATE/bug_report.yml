name: Bug report
description: Something is broken or behaves unexpectedly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        Please do not include other students' names, email addresses, messages, or screenshots that show their content.
        Security vulnerabilities must not be reported here: use [private vulnerability reporting](https://github.com/AdityaKumar0927/campus-wide/security/advisories/new) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug. Paste error messages verbatim if you saw any.
      placeholder: When I ..., the page ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps starting from a fresh page load.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: viewport
    attributes:
      label: Viewport
      description: Where did you see it? Campus Wide is verified at 390 px and 1440 px.
      options:
        - Mobile (≤ 430 px)
        - Tablet
        - Desktop
    validations:
      required: true
  - type: input
    id: browser-os
    attributes:
      label: Browser and OS
      placeholder: e.g. Safari on iOS 26, Chrome 150 on Windows 11
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Campus role
      options:
        - Student
        - Moderator
        - University admin
        - Other
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no personal data of other students (names, email addresses, messages, photos).
          required: true
