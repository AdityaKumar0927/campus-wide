name: Feature request
description: Suggest an improvement or a new capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, skim `docs/BRIEF.md` and `PLAN.md`: many features are already planned for a later phase.
        Please keep requests free of other students' personal data.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation rather than the solution. Who is affected, and how often?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen? Sketches or examples from other tools are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why they fall short.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Feed / posts
        - Q&A
        - Events
        - Marketplace
        - Meal gifting
        - Lost & found
        - Rides
        - Study groups
        - Roommates / sublets
        - Polls
        - Moderation
        - Admin portal
        - Auth / accounts
        - Privacy / compliance
        - Accessibility
        - PWA / offline
        - Other
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Campus role
      options:
        - Student
        - Moderator
        - University admin
        - Other
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request does not involve payments, resale of meal credits, or exposing student email addresses.
          required: true
